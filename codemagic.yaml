# FARQ B2B iOS — manual TestFlight release workflow.
# Credentials live only in Codemagic variable group `farq_ios`; no secrets are committed.
workflows:
  ios-testflight:
    name: FARQ B2B iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - farq_ios
      vars:
        BUNDLE_ID: "sa.farq.b2b"
        XCODE_PROJECT: "ios/FarqB2B/FarqB2B.xcodeproj"
        XCODE_SCHEME: "FarqB2B"
        IOS_MARKETING_VERSION: "1.0.0"
      xcode: latest
    scripts:
      - name: Apply App Store signing profile
        script: |
          set -euo pipefail
          for variable in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing $variable in Codemagic variable group farq_ios."
              exit 1
            fi
          done
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set release version
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $IOS_MARKETING_VERSION" ios/FarqB2B/Sources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/FarqB2B/Sources/Info.plist
      - name: Archive signed IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
