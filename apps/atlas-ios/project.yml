name: FarqAtlas
options:
  bundleIdPrefix: sa.farq
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  Pow:
    url: https://github.com/EmergeTools/Pow
    from: 1.0.5
  SwiftUIX:
    url: https://github.com/SwiftUIX/SwiftUIX
    from: 0.3.2
  ComponentsKit:
    url: https://github.com/componentskit/ComponentsKit
    from: 1.7.1
settings:
  base:
    DEVELOPMENT_TEAM: MH7J92HV9N
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    SDKROOT: iphoneos
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      DEBUG_INFORMATION_FORMAT: dwarf
      ONLY_ACTIVE_ARCH: YES
      GCC_OPTIMIZATION_LEVEL: "0"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      VALIDATE_PRODUCT: YES
targets:
  FarqAtlas:
    type: application
    platform: iOS
    sources:
      - path: FarqAtlas
    dependencies:
      - package: Pow
      - package: SwiftUIX
      - package: ComponentsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.farq.atlas
        PRODUCT_NAME: FarqAtlas
        INFOPLIST_FILE: FarqAtlas/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  FarqAtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FarqAtlasTests
    dependencies:
      - target: FarqAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.farq.atlas.tests
        PRODUCT_NAME: FarqAtlasTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FarqAtlas.app/FarqAtlas"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  FarqAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FarqAtlasUITests
    dependencies:
      - target: FarqAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.farq.atlas.uitests
        PRODUCT_NAME: FarqAtlasUITests
        TEST_TARGET_NAME: FarqAtlas
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FarqAtlas:
    build:
      targets:
        FarqAtlas: all
    test:
      targets:
        - FarqAtlasTests
        - FarqAtlasUITests
