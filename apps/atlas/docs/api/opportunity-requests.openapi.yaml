openapi: 3.1.0
info:
  title: Atlas opportunity requests proxy
  version: 1.0.0
  description: |
    Same-origin Atlas proxy for Farq business opportunity requests. Atlas keeps
    Farq access tokens in an HttpOnly session cookie; browsers never receive one.
paths:
  /api/market/entities:
    post:
      summary: Search the live business directory for a named commercial activity
      description: |
        Private, same-origin directory proxy. `purchase` finds suppliers or the
        named trade. `marketing` finds business types that may be relevant
        buyers; it never asserts active demand or contact consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city, objective]
              properties:
                q: { type: string, minLength: 1, maxLength: 200 }
                city: { type: string, enum: [riyadh, jeddah, dammam] }
                objective: { type: string, enum: [purchase, marketing, browse], description: browse is permitted only with district and has no semantic query. }
                limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
                offset: { type: integer, minimum: 0, default: 0 }
                district:
                  type: string
                  maxLength: 100
                  description: Canonical Arabic district name. Restricts the list and the issued map context to that district.
      responses:
        '200':
          description: A page of named businesses plus an opaque, short-lived mapQuery for the identical cohort. Contact details are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [total, rows, offset, hasMore, mapQuery]
                properties:
                  total: { type: integer, minimum: 0 }
                  withWhatsapp: { type: integer, minimum: 0, description: Source signal only; it is not contact consent. }
                  rows: { type: array, items: { type: object } }
                  offset: { type: integer, minimum: 0 }
                  hasMore: { type: boolean }
                  nextOffset: { type: [integer, 'null'], minimum: 0 }
                  mapQuery: { type: [string, 'null'], description: Opaque context accepted only by the tile proxy. }
        '400': { description: Missing query, city, or recognised objective }
        '401': { description: Atlas session is missing or expired }
        '403': { description: User has no directory permission }
        '502': { description: Directory service unavailable }
        '503': { description: Directory proxy is not configured }
  /api/market/tiles/{query}/{z}/{x}/{y}.pbf:
    get:
      summary: Read a vector tile for the exact authenticated directory cohort
      description: |
        Private same-origin vector-tile proxy. The `query` context is opaque,
        short-lived, and issued by `/api/market/entities`; a tile contains only
        display geometry, a point key, label, and aggregate count.
      parameters:
        - in: path
          name: query
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{32}$' }
        - in: path
          name: z
          required: true
          schema: { type: integer, minimum: 0, maximum: 20 }
        - in: path
          name: x
          required: true
          schema: { type: integer, minimum: 0 }
        - in: path
          name: y
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200': { description: Mapbox Vector Tile, content: { application/vnd.mapbox-vector-tile: {} } }
        '400': { description: Invalid tile coordinate or query context }
        '401': { description: Atlas session is missing or is not eligible for directory access }
        '410': { description: Map context expired; repeat the entity search }
        '502': { description: Directory tile service unavailable }
        '503': { description: Directory proxy is not configured }
  /api/requests:
    get:
      summary: List the signed-in organization's saved requests
      parameters:
        - in: query
          name: hidden
          schema: { type: string, enum: [exclude, include, only] }
        - in: query
          name: archived
          schema: { type: string, enum: [exclude, include, only] }
        - in: query
          name: kind
          schema: { type: string }
      responses:
        '200': { description: Requests returned from Farq }
        '401': { description: Atlas session is missing or expired }
        '403': { description: User has no business organization or permission }
        '404': { description: Opportunity requests are not enabled upstream }
    post:
      summary: Save a draft request for the signed-in organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, title]
              properties:
                kind:
                  type: string
                  enum: [BOOKLET, PURCHASE_REQUEST, SELLER_CATALOG, SELLER_PRODUCTS, SEARCH]
                title: { type: string, maxLength: 200 }
                payload: { type: object }
      responses:
        '200': { description: Request saved; no recipient contact occurs }
        '401': { description: Atlas session is missing or expired }
        '403': { description: CSRF, organization, or permission rejection }
        '404': { description: Opportunity requests are not enabled upstream }
        '413': { description: Request payload exceeds 16 KiB }
