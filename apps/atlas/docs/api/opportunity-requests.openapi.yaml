openapi: 3.1.0
info:
  title: Atlas opportunity requests proxy
  version: 1.0.0
  description: |
    Same-origin Atlas proxy for Farq business opportunity requests. Atlas keeps
    Farq access tokens in an HttpOnly session cookie; browsers never receive one.
paths:
  /api/market/entities:
    post:
      summary: Search the live business directory for a named commercial activity
      description: |
        Private, same-origin directory proxy. `purchase` finds suppliers or the
        named trade. `marketing` finds business types that may be relevant
        buyers; it never asserts active demand or contact consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q, city, objective]
              properties:
                q: { type: string, minLength: 1, maxLength: 200 }
                city: { type: string, enum: [riyadh, jeddah, dammam] }
                objective: { type: string, enum: [purchase, marketing] }
                limit: { type: integer, minimum: 1, maximum: 50, default: 30 }
      responses:
        '200': { description: Business rows whose activity matches the requested commercial direction }
        '400': { description: Missing query, city, or recognised objective }
        '401': { description: Atlas session is missing or expired }
        '403': { description: User has no directory permission }
        '502': { description: Directory service unavailable }
        '503': { description: Directory proxy is not configured }
  /api/requests:
    get:
      summary: List the signed-in organization's saved requests
      parameters:
        - in: query
          name: hidden
          schema: { type: string, enum: [exclude, include, only] }
        - in: query
          name: archived
          schema: { type: string, enum: [exclude, include, only] }
        - in: query
          name: kind
          schema: { type: string }
      responses:
        '200': { description: Requests returned from Farq }
        '401': { description: Atlas session is missing or expired }
        '403': { description: User has no business organization or permission }
        '404': { description: Opportunity requests are not enabled upstream }
    post:
      summary: Save a draft request for the signed-in organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, title]
              properties:
                kind:
                  type: string
                  enum: [BOOKLET, PURCHASE_REQUEST, SELLER_CATALOG, SELLER_PRODUCTS, SEARCH]
                title: { type: string, maxLength: 200 }
                payload: { type: object }
      responses:
        '200': { description: Request saved; no recipient contact occurs }
        '401': { description: Atlas session is missing or expired }
        '403': { description: CSRF, organization, or permission rejection }
        '404': { description: Opportunity requests are not enabled upstream }
        '413': { description: Request payload exceeds 16 KiB }
